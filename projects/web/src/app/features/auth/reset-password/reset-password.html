<form
	class="auth-form"
	[formRoot]="resetForm"
>
	<header>
		<h1 class="auth-form-heading">Reset Password</h1>
	</header>

	<mat-form-field
		class="auth-input"
		appearance="outline"
	>
		<mat-label>Email</mat-label>
		<input
			matInput
			autocomplete="email"
			data-testid="reset-password-email-input"
			type="email"
			placeholder="your@email.com"
			[formField]="resetForm.email"
		/>
		<mat-error>
			<saanboc-validation-message [errors]="resetForm.email().errors()" />
		</mat-error>
	</mat-form-field>

	<footer class="auth-form-footer">
		<div class="auth-form-links">
			<a [routerLink]="authChildPaths.login.url">Login</a>
		</div>

		<button
			type="submit"
			data-testid="reset-password-submit-button"
			matButton="outlined"
			[showProgress]="resetForm().submitting()"
			[disabled]="resetResult()"
		>
			Reset Password
			<saanboc-loading-spinner progressIndicator />
		</button>
	</footer>
	@if (resetResult(); as result) {
		<p>{{ result }}</p>
	}
</form>
