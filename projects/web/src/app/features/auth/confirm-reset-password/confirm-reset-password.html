<form
	class="auth-form"
	[formRoot]="confirmForm"
>
	<header>
		<h1 class="auth-form-heading">Confirm Password Reset</h1>
	</header>

	<mat-form-field
		class="auth-input"
		appearance="outline"
	>
		<mat-label>New Password</mat-label>
		<input
			matInput
			autocomplete="new-password"
			placeholder="••••••••"
			data-testid="confirm-reset-password-password-input"
			type="password"
			[formField]="confirmForm.password"
		/>
		<mat-error>
			<saanboc-validation-message [errors]="confirmForm.password().errors()" />
		</mat-error>
	</mat-form-field>

	<mat-form-field
		class="auth-input"
		appearance="outline"
	>
		<mat-label>Confirm New Password</mat-label>
		<input
			matInput
			autocomplete="new-password"
			placeholder="••••••••"
			data-testid="confirm-reset-password-password-confirmation-input"
			type="password"
			[formField]="confirmForm.passwordConfirmation"
		/>
		<mat-error>
			<saanboc-validation-message [errors]="confirmForm.passwordConfirmation().errors()" />
		</mat-error>
	</mat-form-field>

	<footer class="auth-form-footer">
		<div class="auth-form-links">
			<a [routerLink]="authChildPaths.login.url">Login</a>
		</div>

		<button
			type="submit"
			data-testid="confirm-reset-password-submit-button"
			matButton="outlined"
			[showProgress]="confirmForm().submitting()"
		>
			Confirm New Password
			<saanboc-loading-spinner progressIndicator />
		</button>
	</footer>
</form>
