<form
	class="auth-form"
	[formRoot]="loginForm"
>
	<header>
		<h1 class="auth-form-heading">Log In</h1>
	</header>

	<mat-form-field
		class="auth-input"
		appearance="outline"
	>
		<mat-label>Email</mat-label>
		<input
			matInput
			type="email"
			autocomplete="email"
			placeholder="your@email.com"
			data-testid="login-email-input"
			[formField]="loginForm.email"
		/>
		<mat-error>
			<saanboc-validation-message [errors]="loginForm.email().errors()" />
		</mat-error>
	</mat-form-field>

	<mat-form-field
		class="auth-input"
		appearance="outline"
	>
		<mat-label>Password</mat-label>
		<input
			matInput
			autocomplete="current-password"
			type="password"
			placeholder="yourSecretPassword123"
			data-testid="login-password-input"
			[formField]="loginForm.password"
		/>
		<mat-error>
			<saanboc-validation-message [errors]="loginForm.password().errors()" />
		</mat-error>
	</mat-form-field>

	<footer class="auth-form-footer">
		<div class="auth-form-links">
			<a [routerLink]="routePaths.dashboard.url">Dashboard</a>
			<a [routerLink]="routePaths.auth.children.forgotPassword.url">Forgot Password?</a>
		</div>

		<button
			data-testid="login-submit-button"
			matButton="outlined"
			type="submit"
			[showProgress]="loginForm().submitting()"
		>
			Sign In
			<saanboc-loading-spinner progressIndicator />
		</button>
	</footer>
</form>
